<svg xmlns="http://www.w3.org/2000/svg" width="360" height="232" viewBox="0 0 360 232" role="img" aria-label="syahronirizki most used languages">
  <title>syahronirizki most used languages</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="55%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; }
    .h { font-size: 15px; font-weight: 600; fill: #e6e6f0; }
    .k { font-size: 12.5px; fill: #9d97c9; }
    .v { font-size: 15px; font-weight: 700; fill: #e6e6f0; }
    .s { font-size: 10.5px; fill: #9d97c9; }
  </style>
  <rect width="360" height="232" rx="10" fill="url(#plate)"/>
  <rect x="0.5" y="0.5" width="359" height="231" rx="10" fill="none"
        stroke="#7c6cf5" stroke-opacity="0.35"/>
  <text x="22" y="34" class="h">Most used languages</text>
  <line x1="22" y1="46" x2="338" y2="46" stroke="#7c6cf5" stroke-opacity="0.3"/>
  <rect x="22.0" y="64" width="104.6" height="10" rx="5" fill="#3178c6"/>
  <rect x="128.6" y="64" width="85.7" height="10" rx="5" fill="#41b883"/>
  <rect x="216.3" y="64" width="54.0" height="10" rx="5" fill="#f1e05a"/>
  <rect x="272.3" y="64" width="32.3" height="10" rx="5" fill="#00b4ab"/>
  <rect x="306.6" y="64" width="19.1" height="10" rx="5" fill="#4F5D95"/>
  <rect x="327.7" y="64" width="8.3" height="10" rx="5" fill="#e34c26"/>
  <g><circle cx="27" cy="102" r="5" fill="#3178c6"/><text x="40" y="106" class="k">TypeScript</text><text x="168" y="106" class="s" text-anchor="end">33.7%</text></g>
  <g><circle cx="187" cy="102" r="5" fill="#41b883"/><text x="200" y="106" class="k">Vue</text><text x="328" y="106" class="s" text-anchor="end">27.7%</text></g>
  <g><circle cx="27" cy="128" r="5" fill="#f1e05a"/><text x="40" y="132" class="k">JavaScript</text><text x="168" y="132" class="s" text-anchor="end">17.7%</text></g>
  <g><circle cx="187" cy="128" r="5" fill="#00b4ab"/><text x="200" y="132" class="k">Dart</text><text x="328" y="132" class="s" text-anchor="end">10.9%</text></g>
  <g><circle cx="27" cy="154" r="5" fill="#4F5D95"/><text x="40" y="158" class="k">PHP</text><text x="168" y="158" class="s" text-anchor="end">6.7%</text></g>
  <g><circle cx="187" cy="154" r="5" fill="#e34c26"/><text x="200" y="158" class="k">HTML</text><text x="328" y="158" class="s" text-anchor="end">3.3%</text></g>
  <text x="22" y="214" class="s">Weighted by bytes across public and private repos.</text>
</svg>
