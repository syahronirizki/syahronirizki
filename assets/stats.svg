<svg xmlns="http://www.w3.org/2000/svg" width="420" height="232" viewBox="0 0 420 232" role="img" aria-label="syahronirizki GitHub activity">
  <title>syahronirizki GitHub activity</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="55%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; }
    .h { font-size: 15px; font-weight: 600; fill: #e6e6f0; }
    .k { font-size: 12.5px; fill: #9d97c9; }
    .v { font-size: 15px; font-weight: 700; fill: #e6e6f0; }
    .s { font-size: 10.5px; fill: #9d97c9; }
  </style>
  <rect width="420" height="232" rx="10" fill="url(#plate)"/>
  <rect x="0.5" y="0.5" width="419" height="231" rx="10" fill="none"
        stroke="#7c6cf5" stroke-opacity="0.35"/>
  <text x="22" y="34" class="h">syahronirizki &#183; activity</text>
  <line x1="22" y1="46" x2="398" y2="46" stroke="#7c6cf5" stroke-opacity="0.3"/>
  <g><text x="22" y="74" class="k">Contributions (last year)</text><text x="398" y="74" class="v" text-anchor="end">871</text></g>
  <g><text x="22" y="99" class="k">Private contributions</text><text x="398" y="99" class="v" text-anchor="end">0</text></g>
  <g><text x="22" y="124" class="k">Pull requests</text><text x="398" y="124" class="v" text-anchor="end">105</text></g>
  <g><text x="22" y="149" class="k">Current streak</text><text x="398" y="149" class="v" text-anchor="end">2 days</text></g>
  <g><text x="22" y="174" class="k">Longest streak (1y)</text><text x="398" y="174" class="v" text-anchor="end">7 days</text></g>
  <g><text x="22" y="199" class="k">Repositories owned</text><text x="398" y="199" class="v" text-anchor="end">19</text></g>
</svg>
