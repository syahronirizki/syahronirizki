name: Refresh profile stats

# Regenerates assets/stats.svg and assets/langs.svg in-repo, so the README
# never depends on a third-party image service staying online.

on:
  schedule:
    - cron: "17 22 * * *" # daily, ~05:17 WIB
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/gen_stats.py
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify streak maths
        run: python3 scripts/gen_stats.py --selfcheck

      - name: Generate cards
        env:
          # METRICS_TOKEN is a classic PAT with `repo` + `read:user`; it makes
          # private contributions and private-repo languages count. Without it
          # the built-in token still works, but only sees public activity.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_stats.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "chore: refresh profile stats"
          git push
